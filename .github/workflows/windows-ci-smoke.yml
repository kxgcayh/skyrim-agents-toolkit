name: Windows CI smoke
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-ci-smoke.yml
      - tests/run_harness_tests.py
      - tests/test_loot_advisor.py
      - tests/test_skyguard_agy_adapter.py
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Provision the Windows Documents known folder
        shell: pwsh
        run: |
          $documents = [Environment]::GetFolderPath('MyDocuments', 'Create')
          if (-not $documents -or -not (Test-Path -LiteralPath $documents -PathType Container)) {
            throw 'The Windows Documents known folder could not be provisioned.'
          }
      - name: Run the libloot and Antigravity regressions
        shell: bash
        env:
          TOOLKIT_REQUIRE_HARNESS: "1"
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock
          python -B tests/run_harness_tests.py -v -rfEs \
            tests/test_loot_advisor.py::test_real_libloot_tiny_sort \
            tests/test_skyguard_agy_adapter.py::test_the_payload_cwd_wins_over_the_first_workspace_folder | tee smoke.log
          grep -F 'tests/test_loot_advisor.py::test_real_libloot_tiny_sort PASSED' smoke.log
          grep -F 'tests/test_skyguard_agy_adapter.py::test_the_payload_cwd_wins_over_the_first_workspace_folder PASSED' smoke.log
